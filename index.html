<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <style>
        header{
            width: 100vw;
            background-color: hsl(217, 68%, 32%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px;
            flex-direction: column;
        }
        .container h2{
         text-align: center;
         
        }

    </style>
</head>
<body>   
<header>
   <img src="./imgs/senai.png" alt="logo senai">
</header>
<section>
    <div class="container">
        <h2>CADASTRO</h2>
      <form class="3-colunas">

    <!-- INICIO -->
    <div class="coluna">
      <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome completo" required>
      </div>

    <div class="campo">
      <label for="data">Data de Nascimento</label>
      <input type="text" id="data" placeholder="dd/mm/aaaa" required>
      </div>

    <div class="campo">
    <label for="vinculo">Vínculo com o SENAI</label>
    <select id="vinculo" required>
          <option value="">Selecione</option>
          <option value="Aluno">Aluno</option>
          <option value="Professor">Professor</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
    </div>

    <!-- MEIO -->
    <div class="coluna">
      <div class="campo">
        <label for="setor">Turma / Setor</label>
        <input type="text" id="setor" placeholder="Ex: TI" required>
      </div>

      <div class="campo">
        <label for="cep">CEP</label>
        <div class="cep-grupo">
          <input type="text" id="cep" placeholder="00000-000" required>
          <button type="button" onclick="buscar()">BUSCAR</button>
        </div>
      </div>

      <div class="campo">
        <label for="logradouro">Logradouro</label>
        <input type="text" id="logradouro" placeholder="..." required>
      </div>

      <div class="campo">
        <label for="numero">Número</label>
        <input type="text" id="numero" placeholder="Ex: 123" required>
      </div>
    </div>

    <!-- COLUNA DIREITA -->
    <div class="coluna">
      <div class="campo">
        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" placeholder="Ex: Apto 101 (opcional)">
      </div>

      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" placeholder="Ex: Centro" required>
      </div>



      <div class="campo">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" placeholder="Ex: Betim" required>
      </div>

      <div class="campo">
        <label for="uf">UF</label>
        <select id="uf" required>
          <option value="">Selecione</option>
          <option value="MG">MG</option>
          <option value="SP">SP</option>
          <option value="RJ">RJ</option>
        </select>
      </div>



      <!--BUTTON-->
      <div class="limpar">
        <button  type="button" onclick="limpar()">LIMPAR</button>
      </div>
      <div class="adicionar">
        <button type="button"  onclick="adicionar()">ADICIONAR</button>
      </div>
    </div>

  </form>
</div>
</section>
</body>
</html>
