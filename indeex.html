<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <style>
        header{
            width: 100vw;
            background-color: hsl(217, 68%, 32%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        .container h2{
         text-align: center;
        }
    </style>
</head>
<body>   
<header>
   <img src="./imgs/tela.png" alt="logo senai">
</header>

    </header>
    <!--CONTEÚDO PÁGINA-->
<section>
    <div class="container">
        <h2>CADASTRO</h2>
        
        <div>
            <form>
            <label>Nome Completo</label>
            <div>  
                <input type="text" id="nome" placeholder="Digite o nome completo" required>
            </div>
        </div>
        <label>Data de Nascimento</label>
        <div>
            <input type="text" id="data" placeholder="dd/mm/aaaa" required>
        </div>
        <label>Vinculo com o SENAI</label>
        <div>
        <input type="text" id="vinculo" placeholder="Selecione" >
        <select required>
            <option value=""></option>
            <option value="Aluno">Aluno</option>
            <option value="Professor">Professor</option>
            <option value="Outro">Outro</option>
        </select>
        </div>
    </div>
    <label>Turma / Setor</label>
    <div>
        <input type="text" id="setor" placeholder="Ex: TI" required>
    </div>
    <label>CEP</label>
    <div>
        <input type="text" id="location" placeholder="00000-000" required>
        <button onclick="buscar()">BUSCAR</button>
    </div>
    <label>Logradouro</label>
    <div>
        <input type="text" id="log" placeholder="..." required>
    </div>
    <label>Número</label>
    <div>
        <input type="text"  id="numbers" placeholder="Ex: 123" required>
    </div>
    <label>Complemento</label>
    <div>
        <input type="text" id="city" placeholder="Ex: Apto 101(opcional)" required>
    </div>
    <label>Bairro</label>
    <div>
    <input type="text" id="look" placeholder="Ex: Centro" required>
    </div>
    <label>Cidade</label>
    <div>
    <input type="text" id="home" placeholder="Ex: Betim" required>
    </div>
    <label>UF</label>
    <div>
    <input placeholder="Ex: MG">
    <select required>
        <option value=""></option>
        <option value="MG">MG</option>
        <option value="RJ">RJ</option>
        <option value="RJ">AC</option>
        <option value="RJ">SP</option>
        <option value="RJ">RS</option>
    </select>
    </div>
          <div>
        <button type="submit">Cadastrar</button>
            <button type="reset"> Limpar</button>
          </div>
    </div>
   </form>
</section>
<!--FIM SESSÃO CONTEÚDO-->
    
</body>
</html>
